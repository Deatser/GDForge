name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  mod:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    name: Mod (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: mod
          combine: true

  package:
    name: Package mod
    runs-on: ubuntu-latest
    needs: [mod]

    steps:
      # Merges the per-platform builds into a single .geode file
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: GD Forge mod
          path: ${{ steps.build.outputs.build-output }}

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm test
